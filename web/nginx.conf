server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API se sirve desde el mismo origen que la SPA, así el navegador nunca
    # hace una petición cruzada y no interviene CORS. Reemplaza al proxy que
    # Vite provee en desarrollo.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router maneja las rutas del lado del cliente. Sin este fallback,
    # entrar directo a /perfil o recargar la página devolvería 404, porque no
    # existe un archivo con ese nombre en disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, así que se pueden cachear para
    # siempre; index.html no, o el navegador seguiría sirviendo una versión
    # vieja después de un despliegue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
